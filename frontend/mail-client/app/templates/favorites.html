<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранные почты</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/materials.css">
    <link rel="stylesheet" href="/static/css/favorites.css">
</head>

<body>
    <div class="app-container materials-app-container favorites-app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="brand-block">
                    <h2>Почта менеджера</h2>
                </div>

                <nav class="header-nav" aria-label="Основная навигация">
                    <a href="/inbox" class="nav-btn">
                        Входящие
                    </a>

                    <a href="/archived" class="nav-btn">
                        Отработанные
                    </a>

                    <a href="/sent" class="nav-btn">
                        Исходящие
                    </a>

                    <a href="/materials" class="nav-btn">
                        Материалы
                    </a>

                    <a
                        href="/favorites"
                        class="nav-btn active"
                        aria-current="page"
                    >
                        Избранные почты
                    </a>
                </nav>
            </div>

            <div class="header-right">
                <span class="user-email">{{ user.email }}</span>
                <span class="user-name">{{ user.name }}</span>
                <a href="/logout" class="logout-btn">Выйти</a>
            </div>
        </header>

        <main class="materials-page">
            <section class="materials-panel" aria-labelledby="favorites-title">
                <div class="materials-page-header">
                    <div>
                        <h1 id="favorites-title" class="materials-title">
                            Избранные почты
                        </h1>

                        <p class="materials-subtitle">
                            Общий список избранных адресов.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="favorites-add-btn"
                        class="materials-add-btn"
                    >
                        Добавить почту
                    </button>
                </div>

                <div class="materials-search-container">
                    <div class="materials-search-wrapper">
                        <input
                            type="search"
                            id="favorites-search-input"
                            class="materials-search-input favorites-search-input"
                            placeholder="Поиск по адресу или комментарию"
                            aria-label="Поиск по адресу или комментарию"
                            maxlength="255"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            id="favorites-search-clear-btn"
                            class="materials-search-clear-btn"
                            aria-label="Очистить поиск"
                            title="Очистить поиск"
                            hidden
                        >
                            ×
                        </button>
                    </div>
                </div>

                <div
                    id="favorites-status"
                    class="materials-status"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <div
                    id="favorites-error"
                    class="favorites-error"
                    role="alert"
                    hidden
                >
                    <span id="favorites-error-text"></span>

                    <button
                        type="button"
                        id="favorites-retry-btn"
                        class="materials-retry-btn"
                        hidden
                    >
                        Повторить
                    </button>
                </div>

                <div class="materials-table-wrap">
                    <table class="materials-table favorites-table">
                        <thead>
                            <tr>
                                <th scope="col" class="favorites-email-heading">
                                    Почтовый адрес
                                </th>

                                <th scope="col">
                                    Комментарий
                                </th>

                                <th scope="col" class="materials-actions-heading">
                                    Действия
                                </th>
                            </tr>
                        </thead>

                        <tbody id="favorites-table-body"></tbody>
                    </table>
                </div>

                <div
                    id="favorites-empty-state"
                    class="materials-empty-state"
                    hidden
                ></div>

                <div class="materials-load-more-wrap">
                    <button
                        type="button"
                        id="favorites-load-more-btn"
                        class="materials-load-more-btn"
                        hidden
                    >
                        Показать ещё
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/mail-formatters.js"></script>
    <script src="/static/js/favorites-api.js"></script>
    <script src="/static/js/favorites-page.js"></script>
</body>
</html>
