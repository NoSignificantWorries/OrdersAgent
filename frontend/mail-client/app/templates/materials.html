<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Материалы</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/materials.css">
</head>

<body>
    <div class="app-container materials-app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="brand-block">
                    <h2>Почта менеджера</h2>
                </div>

                <nav class="header-nav" aria-label="Основная навигация">
                    <a
                        href="/inbox"
                        class="nav-btn {% if current_page == 'inbox' %}active{% endif %}"
                        {% if current_page == 'inbox' %}aria-current="page"{% endif %}
                    >
                        Входящие
                    </a>

                    <a
                        href="/archived"
                        class="nav-btn {% if current_page == 'archived' %}active{% endif %}"
                        {% if current_page == 'archived' %}aria-current="page"{% endif %}
                    >
                        Отработанные
                    </a>

                    <a
                        href="/sent"
                        class="nav-btn {% if current_page == 'sent' %}active{% endif %}"
                        {% if current_page == 'sent' %}aria-current="page"{% endif %}
                    >
                        Исходящие
                    </a>

                    <a
                        href="/materials"
                        class="nav-btn {% if current_page == 'materials' %}active{% endif %}"
                        {% if current_page == 'materials' %}aria-current="page"{% endif %}
                    >
                        Материалы
                    </a>
                </nav>
            </div>

            <div class="header-right">
                <span class="user-email">{{ user.email }}</span>
                <span class="user-name">{{ user.name }}</span>
                <a href="/logout" class="logout-btn">Выйти</a>
            </div>
        </header>

        <main class="materials-page">
            <section class="materials-panel" aria-labelledby="materials-title">
                <div class="materials-page-header">
                    <div>
                        <h1 id="materials-title" class="materials-title">Материалы</h1>
                        <p class="materials-subtitle">
                            Сопоставление наименований заказчика с материалами и артикулами системы.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="materials-add-btn"
                        class="materials-add-btn"
                    >
                        Добавить материал
                    </button>
                </div>

                <div class="materials-search-container">
                    <div class="materials-search-wrapper">
                        <span class="materials-search-icon" aria-hidden="true">🔍</span>

                        <input
                            type="text"
                            id="materials-search-input"
                            class="materials-search-input"
                            placeholder="Поиск по материалу, названию в системе или артикулу"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            id="materials-search-clear-btn"
                            class="materials-search-clear-btn"
                            aria-label="Очистить поиск материалов"
                            title="Очистить поиск"
                            hidden
                        >
                            ×
                        </button>
                    </div>
                </div>

                <div
                    id="materials-status"
                    class="materials-status"
                    role="status"
                    aria-live="polite"
                ></div>

                <div class="materials-table-wrap">
                    <table class="materials-table">
                        <thead>
                            <tr>
                                <th scope="col">Материал заказчика</th>
                                <th scope="col">Материал в системе</th>
                                <th scope="col">Артикул</th>
                                <th scope="col" class="materials-actions-heading">Действия</th>
                            </tr>
                        </thead>

                        <tbody id="materials-table-body"></tbody>
                    </table>
                </div>

                <div
                    id="materials-empty-state"
                    class="materials-empty-state"
                    hidden
                ></div>

                <div class="materials-load-more-wrap">
                    <button
                        type="button"
                        id="materials-load-more-btn"
                        class="materials-load-more-btn"
                        hidden
                    >
                        Показать ещё
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/mail-formatters.js"></script>
    <script src="/static/js/materials-api.js"></script>
    <script src="/static/js/materials-page.js"></script>
</body>
</html>
