services:
    postgres:
        image: postgres:18-alpine
        container_name: storage
        environment:
            POSTGRES_USER: dmitry
            POSTGRES_PASSWORD: pass
            POSTGRES_DB: mails_data
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "5432:5432"
        volumes:
            - storage_data:/var/lib/postgresql/data
        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "10"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app_network

    pgweb:
        image: sosedoff/pgweb:latest
        container_name: pgweb
        environment:
            PGWEB_DATABASE_URL: postgres://dmitry:pass@postgres:5432/mails_data?sslmode=disable
        ports:
            - "8081:8081"
        depends_on:
            postgres:
                condition: service_healthy
        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "10"
        restart: unless-stopped
        networks:
            - app_network

networks:
    app_network:
        driver: bridge
        name: app_network

volumes:
    storage_data:
