<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Почта менеджера</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>📧 Почта менеджера</h1>
            <p>Войдите через Яндекс, чтобы работать с письмами</p>
            
            <!-- Настоящая кнопка входа через Яндекс -->
            <a href="/auth/yandex" class="yandex-login">
                <img src="https://yastatic.net/s3/lpc/static/icon.png" alt="Яндекс" class="yandex-icon">
                Войти через Яндекс ID
            </a>
            
            <p class="demo-note">
                <small>
                    Будет запрошен доступ к вашему email и имени.<br>
                    Это нужно для персонализации интерфейса.
                </small>
            </p>
        </div>
    </div>
</body>
</html>
