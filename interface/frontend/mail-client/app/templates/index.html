<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Почта - Главная</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h2>📧 Почта менеджера</h2>
            </div>
            <div class="header-right">
                <span class="user-email">{{ user.email }}</span>
                <span class="user-name">{{ user.name }}</span>
                <a href="/logout" class="logout-btn">Выйти</a>
            </div>
        </header>

        <div class="main-layout">
            <!-- Левая панель - список писем -->
            <aside class="email-list">
                <div class="list-header">
                    <h3>Входящие</h3>
                    <span class="email-count">5 писем</span>
                </div>
                <div class="emails-container" id="emailsContainer">
                    <!-- JS заполнит -->
                </div>
            </aside>

            <!-- Правая область с вкладками -->
            <main class="email-content">
                <div class="tabs-container">
                    <div class="tabs-header">
                        <button class="tab-button active" data-tab="emails">Письма</button>
                        <button class="tab-button" data-tab="chat">Чат</button>
                    </div>
                    <div class="tabs-content">
                        <!-- Вкладка Письма -->
                        <div class="tab-pane active" id="tab-emails">
                            <div class="email-view" id="emailView">
                                <div class="email-placeholder">
                                    👈 Выберите письмо из списка
                                </div>
                            </div>
                        </div>
                        <!-- Вкладка Чат -->
                        <div class="tab-pane" id="tab-chat">
                            <div class="chat-container">
                                <div class="chat-materials" id="chat-materials-list">
                                    <!-- JS загрузит сюда чекбоксы материалов -->
                                </div>
                                <div class="chat-message">
                                    <label for="chat-input">Ваш ответ/вопрос:</label>
                                    <textarea id="chat-input" rows="4" placeholder="Введите сообщение..."></textarea>
                                </div>
                                <div class="chat-blacklist">
                                    <label>
                                        <input type="checkbox" id="blacklist-checkbox">
                                        Черный список
                                    </label>
                                </div>
                                <div class="chat-submit">
                                    <button id="chat-send-btn" class="chat-send-button">Отправить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
