<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Почта - Главная</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h2>📧 Почта менеджера</h2>
            </div>
            <div class="header-right">
                <span class="user-email">{{ user.email }}</span>
                <span class="user-name">{{ user.name }}</span>
                <!-- Кнопка выхода как обычная ссылка, не JavaScript -->
                <a href="/logout" class="logout-btn">Выйти</a>
            </div>
        </header>

        <div class="main-layout">
            <!-- Левая панель - список писем -->
            <aside class="email-list">
                <div class="list-header">
                    <h3>Входящие</h3>
                    <span class="email-count">5 писем</span>
                </div>
                <div class="emails-container" id="emailsContainer">
                    <!-- JS заполнит -->
                </div>
            </aside>

            <!-- Центральная область -->
            <main class="email-content">
                <div class="email-view" id="emailView">
                    <div class="email-placeholder">
                        👈 Выберите письмо из списка
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
